<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Herbivicus Inventory</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
    rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    :root {
      --ink: #17261e;
      --forest: #1d3a2c;
      --forest-hi: #2a5040;
      --leaf: #3f7d58;
      --leaf-soft: #e6efe8;
      --leaf-line: #c9dccf;
      --bg: #f4f6f3;
      --card: #fff;
      --line: #e2e8e2;
      --muted: #68786e;
      --faint: #97a49b;
      --petal: #b8456b;
      --petal-soft: #f9e6ec;
      --gold: #b7791f;
      --gold-soft: #fbf0d8;
      --out: #b3382c;
      --out-soft: #fbe5e2;
      --serif: 'Fraunces', Georgia, serif;
      --sans: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
      --r: 10px;
      --shadow: 0 1px 2px rgba(23, 38, 30, .05), 0 6px 20px -8px rgba(23, 38, 30, .10);
    }

    html,
    body {
      height: 100%
    }

    body {
      font-family: var(--sans);
      font-size: 14px;
      color: var(--ink);
      background: var(--bg);
      display: flex;
      overflow: hidden;
      -webkit-font-smoothing: antialiased
    }

    button {
      font-family: inherit
    }

    :focus-visible {
      outline: 2px solid var(--leaf);
      outline-offset: 2px
    }

    /* Sidebar */
    .sidebar {
      width: 248px;
      flex-shrink: 0;
      background: var(--forest);
      color: #d7e6dc;
      display: flex;
      flex-direction: column;
      overflow: hidden
    }

    .brand {
      padding: 26px 24px 20px
    }

    .brand h1 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 24px;
      color: #fff;
      letter-spacing: .2px
    }

    .brand p {
      font-size: 12.5px;
      color: #9db8a7;
      margin-top: 2px
    }

    .side-label {
      padding: 10px 24px 8px;
      font-size: 12px;
      color: #7f9c8b;
      font-weight: 600
    }

    #cat-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 16px
    }

    .cat-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      margin-bottom: 2px;
      border-radius: 8px;
      cursor: pointer;
      color: #c3d6c9;
      font-size: 13.5px;
      transition: background .15s, color .15s
    }

    .cat-item:hover {
      background: rgba(255, 255, 255, .07);
      color: #fff
    }

    .cat-item.active {
      background: #f4f6f3;
      color: var(--forest);
      font-weight: 600
    }

    .cat-item .name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    .cat-badge {
      font-size: 12px;
      font-variant-numeric: tabular-nums;
      color: #8fae9b
    }

    .cat-item.active .cat-badge {
      color: var(--leaf);
      font-weight: 600
    }

    .cat-badge.warn {
      color: #f0c36b
    }

    .side-foot {
      padding: 14px 24px;
      border-top: 1px solid rgba(255, 255, 255, .08);
      font-size: 12px;
      color: #7f9c8b;
      display: flex;
      align-items: center;
      gap: 8px
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #6fcf97
    }

    /* Main */
    .main {
      flex: 1;
      min-width: 0;
      overflow-y: auto;
      padding: 32px 40px 48px;
      display: flex;
      flex-direction: column;
      gap: 22px
    }

    .page-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap
    }

    .page-head h2 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 32px;
      letter-spacing: -.3px;
      line-height: 1.1
    }

    .page-head p {
      color: var(--muted);
      margin-top: 6px;
      font-size: 14px
    }

    /* Stats */
    .stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow)
    }

    .stat {
      padding: 16px 20px;
      border-right: 1px solid var(--line)
    }

    .stat:last-child {
      border-right: none
    }

    .stat .l {
      font-size: 12.5px;
      color: var(--muted)
    }

    .stat .v {
      font-family: var(--serif);
      font-weight: 500;
      font-size: 26px;
      margin-top: 4px;
      font-variant-numeric: tabular-nums
    }

    .stat.warn .v {
      color: var(--gold)
    }

    .stat.bad .v {
      color: var(--out)
    }

    /* Toolbar */
    .toolbar {
      display: flex;
      gap: 10px;
      align-items: center;
      flex-wrap: wrap
    }

    .search-wrap {
      flex: 1;
      min-width: 220px;
      max-width: 420px;
      position: relative
    }

    .search-wrap svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--faint);
      pointer-events: none
    }

    .search-wrap input {
      padding-left: 36px;
      height: 38px;
      background: var(--card)
    }

    .chips {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .chip {
      height: 34px;
      padding: 0 13px;
      border: 1px solid var(--line);
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      color: var(--muted);
      background: var(--card);
      transition: all .15s
    }

    .chip:hover {
      border-color: var(--leaf-line);
      color: var(--leaf)
    }

    .chip.on {
      background: var(--leaf-soft);
      border-color: var(--leaf);
      color: var(--forest);
      font-weight: 600
    }

    .toolbar select {
      width: auto;
      height: 38px;
      background: var(--card);
      margin-left: auto
    }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      height: 38px;
      padding: 0 16px;
      border-radius: 8px;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid transparent;
      transition: background .15s, border-color .15s;
      white-space: nowrap
    }

    .btn:disabled {
      opacity: .55;
      cursor: default
    }

    .btn-primary {
      background: var(--forest);
      color: #fff
    }

    .btn-primary:hover {
      background: var(--forest-hi)
    }

    .btn-secondary {
      background: var(--card);
      color: var(--ink);
      border-color: var(--line)
    }

    .btn-secondary:hover {
      border-color: var(--leaf-line);
      background: var(--leaf-soft)
    }

    .btn-danger {
      background: transparent;
      color: var(--out)
    }

    .btn-danger:hover {
      background: var(--out-soft)
    }

    .btn-ghost {
      background: transparent;
      color: var(--muted);
      width: 34px;
      height: 34px;
      padding: 0
    }

    .btn-ghost:hover {
      background: var(--bg);
      color: var(--ink)
    }

    .btn-sm {
      height: 32px;
      padding: 0 12px;
      font-size: 13px
    }

    /* Table */
    .table-wrap {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      box-shadow: var(--shadow);
      overflow-x: auto
    }

    table {
      width: 100%;
      border-collapse: collapse
    }

    thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--muted);
      border-bottom: 1px solid var(--line);
      white-space: nowrap;
      background: #fafbf9
    }

    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid var(--line);
      vertical-align: middle
    }

    tbody tr:last-child td {
      border-bottom: none
    }

    tbody tr {
      transition: background .12s
    }

    tbody tr:hover {
      background: #f8faf7
    }

    .prod-cell {
      display: flex;
      align-items: center;
      gap: 14px
    }

    .thumb,
    .thumb-ph {
      width: 48px;
      height: 48px;
      border-radius: 8px;
      flex-shrink: 0;
      object-fit: cover
    }

    .thumb-ph {
      background: var(--leaf-soft);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px
    }

    .prod-name {
      font-weight: 600;
      max-width: 300px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .prod-id {
      font-size: 12px;
      color: var(--faint);
      margin-top: 2px
    }

    .price-cell {
      font-weight: 600;
      white-space: nowrap;
      font-variant-numeric: tabular-nums
    }

    .sci {
      font-family: var(--serif);
      font-style: italic;
      color: var(--muted)
    }

    .sub {
      color: var(--muted);
      font-size: 13px
    }

    .stock-input {
      width: 76px;
      height: 34px;
      padding: 0 8px;
      border: 1px solid var(--line);
      border-radius: 7px;
      font-size: 13.5px;
      text-align: center;
      font-variant-numeric: tabular-nums;
      background: var(--card);
      font-family: inherit
    }

    .stock-input:focus {
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(63, 125, 88, .14);
      outline: none
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap
    }

    .pill::before {
      content: '';
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: currentColor
    }

    .pill.ok {
      background: var(--leaf-soft);
      color: var(--leaf)
    }

    .pill.low {
      background: var(--gold-soft);
      color: var(--gold)
    }

    .pill.out {
      background: var(--out-soft);
      color: var(--out)
    }

    .pill.na {
      background: var(--bg);
      color: var(--faint)
    }

    .star {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      border-radius: 8px;
      cursor: pointer;
      color: #c8d1ca;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: color .15s, background .15s
    }

    .star:hover {
      background: var(--petal-soft);
      color: var(--petal)
    }

    .star.on {
      color: var(--petal)
    }

    .star.on svg {
      fill: currentColor
    }

    /* Toggle (drawer) */
    .toggle {
      width: 40px;
      height: 22px;
      border-radius: 11px;
      background: #d4dcd6;
      border: none;
      cursor: pointer;
      position: relative;
      transition: background .18s;
      flex-shrink: 0
    }

    .toggle.on {
      background: var(--leaf)
    }

    .toggle::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: #fff;
      transition: left .18s;
      box-shadow: 0 1px 3px rgba(0, 0, 0, .2)
    }

    .toggle.on::after {
      left: 21px
    }

    /* Empty / loading / welcome */
    .empty,
    .loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
      color: var(--muted);
      gap: 10px;
      text-align: center
    }

    .empty strong {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 500;
      color: var(--ink)
    }

    .loading svg {
      animation: spin .9s linear infinite
    }

    .banner {
      background: var(--gold-soft);
      border: 1px solid #efd9a6;
      border-radius: var(--r);
      padding: 12px 16px;
      color: #7a5313;
      display: flex;
      gap: 10px;
      align-items: center
    }

    .welcome h2 {
      font-family: var(--serif);
      font-weight: 600;
      font-size: 34px;
      letter-spacing: -.3px
    }

    .welcome>p {
      color: var(--muted);
      margin: 6px 0 26px
    }

    .tiles {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 14px
    }

    .tile {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 18px 20px;
      cursor: pointer;
      text-align: left;
      transition: border-color .15s, transform .15s, box-shadow .15s
    }

    .tile:hover {
      border-color: var(--leaf);
      box-shadow: var(--shadow);
      transform: translateY(-2px)
    }

    .tile .n {
      font-family: var(--serif);
      font-size: 30px;
      font-weight: 500;
      color: var(--leaf);
      line-height: 1
    }

    .tile .t {
      margin-top: 8px;
      font-weight: 600
    }

    .tile .s {
      font-size: 12.5px;
      color: var(--muted);
      margin-top: 2px
    }

    /* Drawer */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(18, 32, 25, .4);
      backdrop-filter: blur(2px);
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: opacity .2s
    }

    .overlay.open {
      opacity: 1;
      pointer-events: all
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      bottom: 0;
      width: 540px;
      max-width: 100vw;
      background: var(--card);
      z-index: 101;
      box-shadow: -12px 0 40px rgba(18, 32, 25, .16);
      transform: translateX(100%);
      transition: transform .26s cubic-bezier(.4, 0, .2, 1);
      display: flex;
      flex-direction: column
    }

    .drawer.open {
      transform: none
    }

    .drawer-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 24px;
      border-bottom: 1px solid var(--line)
    }

    .drawer-head h2 {
      font-family: var(--serif);
      font-size: 21px;
      font-weight: 600
    }

    .drawer-body {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 18px
    }

    .drawer-foot {
      padding: 14px 24px;
      border-top: 1px solid var(--line);
      display: flex;
      align-items: center;
      gap: 10px;
      background: #fafbf9
    }

    .spacer {
      flex: 1
    }

    /* Forms */
    .fg {
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .fg label {
      font-size: 13px;
      font-weight: 600;
      color: var(--ink)
    }

    .fg label .opt {
      font-weight: 400;
      color: var(--faint);
      font-size: 12.5px
    }

    .req {
      color: var(--petal)
    }

    .f2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px
    }

    .f3 {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 14px
    }

    input[type=text],
    input[type=number],
    textarea,
    select {
      padding: 9px 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      width: 100%;
      background: var(--card);
      color: var(--ink);
      transition: border-color .15s, box-shadow .15s
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: none;
      border-color: var(--leaf);
      box-shadow: 0 0 0 3px rgba(63, 125, 88, .14)
    }

    input[readonly] {
      background: var(--bg);
      color: var(--muted);
      cursor: not-allowed
    }

    textarea {
      resize: vertical;
      min-height: 88px;
      line-height: 1.5
    }

    .section {
      border: 1px solid var(--line);
      border-radius: var(--r);
      overflow: hidden
    }

    .section-head {
      padding: 12px 16px;
      background: #fafbf9;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13.5px;
      font-weight: 600;
      border: none;
      width: 100%;
      color: var(--ink)
    }

    .section-head:hover {
      background: var(--leaf-soft)
    }

    .section-head svg {
      transition: transform .2s;
      color: var(--muted)
    }

    .section-body {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      border-top: 1px solid var(--line)
    }

    .section-body.hidden {
      display: none
    }

    textarea[data-mono] {
      font-family: ui-monospace, 'SF Mono', Menlo, monospace;
      font-size: 12px;
      min-height: 120px
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border: 1px solid var(--line);
      border-radius: var(--r)
    }

    .toggle-row span {
      font-weight: 600
    }

    .img-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap
    }

    .img-pr,
    .img-ph {
      width: 76px;
      height: 76px;
      border-radius: 8px;
      object-fit: cover;
      border: 1px solid var(--line)
    }

    .img-ph {
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--leaf-soft);
      border-style: dashed;
      font-size: 24px
    }

    /* Toast + dialog */
    #toasts {
      position: fixed;
      bottom: 24px;
      right: 24px;
      z-index: 300;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none
    }

    .toast {
      padding: 11px 16px;
      border-radius: 9px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: 0 8px 24px rgba(18, 32, 25, .2);
      animation: slide-up .22s ease;
      background: var(--ink);
      color: #fff
    }

    .toast.ok {
      background: var(--forest)
    }

    .toast.error {
      background: var(--out)
    }

    .dialog-bg {
      position: fixed;
      inset: 0;
      background: rgba(18, 32, 25, .5);
      z-index: 200;
      display: flex;
      align-items: center;
      justify-content: center
    }

    .dialog {
      background: #fff;
      border-radius: 14px;
      padding: 26px;
      max-width: 380px;
      width: 92%;
      box-shadow: 0 24px 60px rgba(0, 0, 0, .25)
    }

    .dialog h3 {
      font-family: var(--serif);
      font-size: 20px;
      font-weight: 600;
      margin-bottom: 8px
    }

    .dialog p {
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 22px
    }

    .dialog-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end
    }

    .dialog .btn-danger {
      background: var(--out);
      color: #fff
    }

    .dialog .btn-danger:hover {
      background: #962d23
    }

    @keyframes slide-up {
      from {
        transform: translateY(10px);
        opacity: 0
      }
    }

    @keyframes spin {
      to {
        transform: rotate(360deg)
      }
    }

    ::-webkit-scrollbar {
      width: 8px;
      height: 8px
    }

    ::-webkit-scrollbar-thumb {
      background: #cfd8d1;
      border-radius: 4px
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        animation: none !important;
        transition: none !important
      }
    }

    @media (max-width:820px) {
      body {
        flex-direction: column;
        overflow: auto
      }

      .sidebar {
        width: 100%;
        flex-direction: row;
        align-items: center;
        overflow-x: auto
      }

      .brand {
        padding: 12px 16px
      }

      .brand p,
      .side-label,
      .side-foot {
        display: none
      }

      #cat-list {
        display: flex;
        padding: 8px;
        gap: 4px;
        overflow-x: auto;
        overflow-y: hidden
      }

      .cat-item {
        white-space: nowrap;
        margin: 0
      }

      .main {
        padding: 20px 16px 40px;
        overflow: visible
      }

      .f2,
      .f3 {
        grid-template-columns: 1fr
      }

      .toolbar select {
        margin-left: 0
      }
    }
  </style>
</head>

<body>

  <aside class="sidebar">
    <div class="brand">
      <h1>Herbivicus</h1>
      <p>Nursery &amp; flower store</p>
    </div>
    <div class="side-label">Categories</div>
    <div id="cat-list">
      <div class="loading" style="padding:24px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-opacity=".25" />
          <path d="M12 3a9 9 0 019 9" />
        </svg></div>
    </div>
    <div class="side-foot"><span class="dot"></span>Local inventory</div>
  </aside>

  <main class="main" id="main"></main>

  <div class="overlay" id="overlay"></div>
  <aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="drawer-title">
    <div class="drawer-head">
      <h2 id="drawer-title">Edit product</h2>
      <button class="btn btn-ghost" id="drawer-close" aria-label="Close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2.2">
          <line x1="18" y1="6" x2="6" y2="18" />
          <line x1="6" y1="6" x2="18" y2="18" />
        </svg></button>
    </div>
    <div class="drawer-body" id="drawer-body"></div>
    <div class="drawer-foot">
      <button class="btn btn-danger btn-sm" id="delete-btn">Delete product</button>
      <div class="spacer"></div>
      <button class="btn btn-secondary" id="cancel-btn">Cancel</button>
      <button class="btn btn-primary" id="save-btn">Save changes</button>
    </div>
  </aside>
  <div id="toasts" aria-live="polite"></div>

  <script>
    'use strict';

    const LOW_STOCK = 5; // units at or below this count as "low"
    const S = { cats: [], activeCat: null, products: [], filtered: [], searchQ: '', filterFeatured: false, filterLow: false, filterOut: false, sort: 'default', editing: null, isNew: false };

    (async () => { await loadCategories(); })();

    async function api(method, path, body) {
      const opts = { method, headers: {} };
      if (body !== undefined) { opts.headers['Content-Type'] = 'application/json'; opts.body = JSON.stringify(body); }
      const res = await fetch('/api/' + path, opts);
      const text = await res.text();
      let data; try { data = JSON.parse(text); } catch { data = text; }
      return { ok: res.ok, status: res.status, data };
    }

    // ── Categories ──
    async function loadCategories() {
      const r = await api('GET', 'categories');
      if (!r.ok) { toast('Could not load categories. Is the server running?', 'error'); return; }
      S.cats = r.data;
      renderSidebar();
      if (!S.activeCat) renderWelcome();
    }
    function renderSidebar() {
      const el = document.getElementById('cat-list');
      if (!S.cats.length) { el.innerHTML = '<div style="padding:12px;font-size:13px;color:#9db8a7">No data files found.</div>'; return; }
      el.innerHTML = S.cats.map(c => `
    <div class="cat-item${c.id === S.activeCat ? ' active' : ''}" data-cat="${h(c.id)}" tabindex="0">
      <span class="name">${h(fmtCat(c.id))}</span>
      <span class="cat-badge${c.parse_error ? ' warn' : ''}" title="${c.parse_error ? 'JSON parse error' : ''}">${c.count}${c.parse_error ? ' ⚠' : ''}</span>
    </div>`).join('');
    }
    function renderWelcome() {
      const total = S.cats.reduce((a, c) => a + (c.count || 0), 0);
      setMain(`<div class="welcome">
    <h2>Good to see you</h2>
    <p>${total} products across ${S.cats.length} categories. Pick one to manage its stock and prices.</p>
    <div class="tiles">${S.cats.map(c => `<button class="tile" data-cat="${h(c.id)}"><div class="n">${c.count}</div><div class="t">${h(fmtCat(c.id))}</div><div class="s">${c.parse_error ? 'Needs attention: JSON error' : 'products'}</div></button>`).join('')}</div>
  </div>`);
    }
    const catClick = e => { const i = e.target.closest('[data-cat]'); if (i) loadProducts(i.dataset.cat); };
    document.getElementById('cat-list').addEventListener('click', catClick);
    document.getElementById('cat-list').addEventListener('keydown', e => { if (e.key === 'Enter') catClick(e); });

    // ── Products ──
    async function loadProducts(cat) {
      Object.assign(S, { activeCat: cat, searchQ: '', filterFeatured: false, filterLow: false, filterOut: false, sort: 'default' });
      renderSidebar();
      setMain(spinner());
      const r = await api('GET', 'products/' + cat);
      if (!r.ok) { setMain(`<div class="banner">${icon('warn')} This category failed to load. Its JSON file may be malformed.</div>`); S.products = []; return; }
      S.products = r.data.products || [];
      applyFilter();
      renderProducts();
    }
    const stockOf = p => (typeof p.stock?.total === 'number' ? p.stock.total : null);
    function stockState(n) { return n === null ? 'na' : n === 0 ? 'out' : n <= LOW_STOCK ? 'low' : 'ok'; }
    function pillHtml(n) {
      const s = stockState(n), t = { na: 'Not tracked', out: 'Out of stock', low: 'Low stock', ok: 'In stock' }[s];
      return `<span class="pill ${s}">${t}</span>`;
    }
    function applyFilter() {
      let list = S.products.slice();
      const q = S.searchQ.toLowerCase();
      if (q) list = list.filter(p => ['id', 'title', 'description', 'plant', 'category'].some(k => (p[k] || '').toLowerCase().includes(q)));
      if (S.filterFeatured) list = list.filter(p => p.stock?.is_featured);
      if (S.filterLow) list = list.filter(p => { const n = stockOf(p); return n !== null && n > 0 && n <= LOW_STOCK; });
      if (S.filterOut) list = list.filter(p => stockOf(p) === 0);
      const by = {
        name: (a, b) => (a.title || '').localeCompare(b.title || ''),
        'stock-asc': (a, b) => (stockOf(a) ?? 1e9) - (stockOf(b) ?? 1e9),
        'price-desc': (a, b) => (b.price?.amount || 0) - (a.price?.amount || 0),
        'price-asc': (a, b) => (a.price?.amount || 0) - (b.price?.amount || 0),
      }[S.sort];
      if (by) list.sort(by);
      S.filtered = list;
    }

    function statsHtml() {
      const P = S.products, units = P.reduce((a, p) => a + (stockOf(p) || 0), 0);
      const low = P.filter(p => { const n = stockOf(p); return n !== null && n > 0 && n <= LOW_STOCK }).length;
      const out = P.filter(p => stockOf(p) === 0).length;
      const feat = P.filter(p => p.stock?.is_featured).length;
      const value = P.reduce((a, p) => a + (stockOf(p) || 0) * (p.price?.amount || 0), 0);
      return `<div class="stat"><div class="l">Products</div><div class="v">${P.length}</div></div>
    <div class="stat"><div class="l">Units on hand</div><div class="v">${units.toLocaleString('en-IN')}</div></div>
    <div class="stat"><div class="l">Stock value</div><div class="v">₹${Math.round(value).toLocaleString('en-IN')}</div></div>
    <div class="stat warn"><div class="l">Low stock</div><div class="v">${low}</div></div>
    <div class="stat bad"><div class="l">Out of stock</div><div class="v">${out}</div></div>
    <div class="stat"><div class="l">Featured</div><div class="v">${feat}</div></div>`;
    }
    function refreshStats() { const z = document.getElementById('stats-zone'); if (z && S.activeCat !== 'medicinal-flora') z.innerHTML = statsHtml(); }

    function renderProducts() {
      const isMed = S.activeCat === 'medicinal-flora';
      const sorts = [['default', 'Sort: Original order'], ['name', 'Name A to Z'], ['stock-asc', 'Lowest stock first'], ['price-desc', 'Price high to low'], ['price-asc', 'Price low to high']];
      setMain(`
  <div class="page-head">
    <div><h2>${h(fmtCat(S.activeCat))}</h2><p>${isMed ? 'Reference entries for medicinal plants.' : 'Track stock, set prices and choose what to feature in the store.'}</p></div>
    <button class="btn btn-primary" id="add-btn"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>Add product</button>
  </div>
  ${isMed ? '' : '<div class="stats" id="stats-zone">' + statsHtml() + '</div>'}
  <div class="toolbar">
    <div class="search-wrap"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.35-4.35"/></svg>
      <input type="text" id="search-input" placeholder="Search by name, ID or description" value="${h(S.searchQ)}" aria-label="Search products"></div>
    ${isMed ? '' : `<div class="chips">
      <button class="chip${S.filterFeatured ? ' on' : ''}" data-filter="featured">Featured</button>
      <button class="chip${S.filterLow ? ' on' : ''}" data-filter="low">Low stock</button>
      <button class="chip${S.filterOut ? ' on' : ''}" data-filter="out">Out of stock</button></div>`}
    <select id="sort-select" aria-label="Sort products">${sorts.map(([v, l]) => `<option value="${v}"${S.sort === v ? ' selected' : ''}>${l}</option>`).join('')}</select>
  </div>
  <div id="table-zone">${tableZoneHtml()}</div>`);
    }
    function tableZoneHtml() {
      if (!S.filtered.length) {
        const filtering = S.searchQ || S.filterFeatured || S.filterLow || S.filterOut;
        return `<div class="table-wrap"><div class="empty"><strong>${filtering ? 'Nothing matches' : 'No products yet'}</strong><span>${filtering ? 'Try a different search or clear the filters.' : 'Add your first product to start tracking stock.'}</span></div></div>`;
      }
      return S.activeCat === 'medicinal-flora' ? renderMedTable() : renderStdTable();
    }
    function refreshTableZone() { const z = document.getElementById('table-zone'); if (z) z.innerHTML = tableZoneHtml(); }

    const starSvg = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><polygon points="12 2 15.1 8.6 22 9.3 16.9 14 18.2 21 12 17.5 5.8 21 7.1 14 2 9.3 8.9 8.6"/></svg>';

    function renderStdTable() {
      return `<div class="table-wrap"><table>
    <thead><tr><th>Product</th><th>Price</th><th>Stock</th><th>Status</th><th>Featured</th><th></th></tr></thead>
    <tbody>${S.filtered.map(p => {
        const imgs = p.media?.images || [], f = p.stock?.is_featured ?? false, st = stockOf(p);
        const thumb = imgs.length ? `<img class="thumb" src="${h(imgs[0])}" alt="" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">` : '';
        return `<tr data-id="${h(p.id)}">
        <td><div class="prod-cell">${thumb}<div class="thumb-ph"${imgs.length ? ' style="display:none"' : ''}>🌿</div>
          <div><div class="prod-name" title="${h(p.title || '')}">${h(p.title || 'Untitled')}</div><div class="prod-id">${h(p.id || '')}</div></div></div></td>
        <td class="price-cell">${fmtPrice(p.price)}</td>
        <td><input class="stock-input" type="number" min="0" value="${st ?? ''}" placeholder="–" aria-label="Stock for ${h(p.title || p.id)}"></td>
        <td class="status-cell">${pillHtml(st)}</td>
        <td><button class="star${f ? ' on' : ''}" title="${f ? 'Remove from featured' : 'Mark as featured'}" aria-label="Toggle featured" aria-pressed="${f}">${starSvg}</button></td>
        <td><button class="btn btn-secondary btn-sm edit-btn">Edit</button></td>
      </tr>`;
      }).join('')}</tbody></table></div>`;
    }
    function renderMedTable() {
      return `<div class="table-wrap"><table>
    <thead><tr><th>Plant</th><th>Scientific name</th><th>Family</th><th>Parts used</th><th></th></tr></thead>
    <tbody>${S.filtered.map(p => `<tr data-id="${h(p.id)}">
      <td><div class="prod-name">${h(p.title || 'Untitled')}</div><div class="prod-id">${h(p.id || '')}</div></td>
      <td class="sci">${h(p.plant || '')}</td><td class="sub">${h(p.family || '')}</td>
      <td class="sub">${(p.parts_used || []).slice(0, 4).map(h).join(', ')}${(p.parts_used || []).length > 4 ? '…' : ''}</td>
      <td><button class="btn btn-secondary btn-sm edit-btn">Edit</button></td></tr>`).join('')}</tbody></table></div>`;
    }

    // ── Inline quick actions ──
    async function quickUpdateStock(id, value, row) {
      const p = S.products.find(x => x.id === id); if (!p) return;
      const upd = deepClone(p); if (!upd.stock) upd.stock = {};
      upd.stock.total = Math.max(0, parseInt(value, 10) || 0);
      const r = await api('PUT', `products/${S.activeCat}/${encodeURIComponent(id)}`, upd);
      if (r.ok) {
        Object.assign(p, upd);
        row.querySelector('.stock-input').value = upd.stock.total;
        row.querySelector('.status-cell').innerHTML = pillHtml(upd.stock.total);
        refreshStats(); toast('Stock updated', 'ok');
      } else toast(r.data?.error || 'Could not update stock', 'error');
    }
    async function quickToggleFeatured(id, row) {
      const p = S.products.find(x => x.id === id); if (!p) return;
      const upd = deepClone(p); if (!upd.stock) upd.stock = {};
      upd.stock.is_featured = !upd.stock.is_featured;
      const r = await api('PUT', `products/${S.activeCat}/${encodeURIComponent(id)}`, upd);
      if (r.ok) {
        Object.assign(p, upd);
        toast(upd.stock.is_featured ? 'Marked as featured' : 'Removed from featured', 'ok');
        const b = row.querySelector('.star'); b.classList.toggle('on', upd.stock.is_featured); b.setAttribute('aria-pressed', upd.stock.is_featured);
        refreshStats();
      } else toast(r.data?.error || 'Could not update featured', 'error');
    }

    // ── Drawer ──
    function openEdit(id) {
      const p = S.products.find(x => x.id === id); if (!p) return;
      S.editing = deepClone(p); S.isNew = false;
      document.getElementById('drawer-title').textContent = 'Edit product';
      document.getElementById('delete-btn').style.display = '';
      buildForm(S.editing); openDrawer();
    }
    function openNew() {
      const isMed = S.activeCat === 'medicinal-flora';
      S.editing = isMed
        ? { id: '', title: '', category: S.activeCat, plant: '', family: '', common_name: [], kashmiri_name: [], therapeutic_properties: [], parts_used: [], health_benefits: [] }
        : { id: '', title: '', category: S.activeCat, description: '', price: { amount: 0, currency: 'INR' }, stock: { total: 0, is_featured: false }, media: { images: [] } };
      S.isNew = true;
      document.getElementById('drawer-title').textContent = 'Add product';
      document.getElementById('delete-btn').style.display = 'none';
      buildForm(S.editing); openDrawer();
    }
    function openDrawer() {
      document.getElementById('drawer').classList.add('open');
      document.getElementById('overlay').classList.add('open');
      setTimeout(() => document.querySelector('#drawer-body input:not([readonly])')?.focus(), 260);
    }
    function closeDrawer() {
      document.getElementById('drawer').classList.remove('open');
      document.getElementById('overlay').classList.remove('open');
      S.editing = null;
    }

    // ── Form builder ──
    const KNOWN_STANDARD = new Set(['id', 'title', 'category', 'description', 'price', 'stock', 'media', 'attributes', 'symbolism', 'subtitle', 'composition', 'growing_guide']);
    const KNOWN_MED = new Set(['id', 'title', 'category', 'plant', 'family', 'common_name', 'kashmiri_name', 'therapeutic_properties', 'parts_used', 'health_benefits', 'growing_guide']);
    function buildForm(p) {
      const isMed = S.activeCat === 'medicinal-flora', known = isMed ? KNOWN_MED : KNOWN_STANDARD;
      const extra = Object.fromEntries(Object.entries(p).filter(([k]) => !known.has(k)));
      document.getElementById('drawer-body').innerHTML = isMed ? medForm(p, extra) : stdForm(p, extra);
    }
    const chev = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>';
    function section(key, title, body, open) {
      return `<div class="section"><button type="button" class="section-head" data-toggle="${key}-body">${title}${chev.replace('<svg', '<svg' + (open ? ' style="transform:rotate(180deg)"' : ''))}</button>
    <div class="section-body${open ? '' : ' hidden'}" id="${key}-body">${body}</div></div>`;
    }
    function stdForm(p, extra) {
      const imgs = p.media?.images || [], attrs = p.attributes || {}, sym = p.symbolism || {}, guide = p.growing_guide || {}, seasons = guide.seasons || {};
      const hasAttrs = Object.keys(attrs).length > 0 || ['flower-saplings', 'plants', 'fruit-plants', 'ornamental-plants', 'veg-saplings', 'veg-seeds', 'bulbs-and-seeds'].includes(S.activeCat);
      const imgPreviews = imgs.length ? imgs.map(s => `<img class="img-pr" src="${h(s)}" alt="" loading="lazy" onerror="this.style.display='none'">`).join('') : '<div class="img-ph">🌿</div>';
      return `
    <div class="fg"><label>Images</label><div class="img-row">${imgPreviews}</div>
      <input type="text" id="f-images" value="${h(imgs.join(', '))}" placeholder="/images/category/name.jpg (comma-separated)"></div>
    <div class="f2">
      <div class="fg"><label>ID <span class="req">*</span></label><input type="text" id="f-id" value="${h(p.id || '')}" placeholder="unique-slug" ${S.isNew ? '' : 'readonly'}></div>
      <div class="fg"><label>Category</label><input type="text" id="f-category" value="${h(p.category || S.activeCat)}"></div>
    </div>
    <div class="fg"><label>Title <span class="req">*</span></label><input type="text" id="f-title" value="${h(p.title || '')}" placeholder="Product title"></div>
    ${p.subtitle !== undefined ? `<div class="fg"><label>Subtitle</label><input type="text" id="f-subtitle" value="${h(p.subtitle || '')}"></div>` : ''}
    <div class="fg"><label>Description</label><textarea id="f-description">${h(p.description || '')}</textarea></div>
    <div class="f3">
      <div class="fg"><label>Price</label><input type="number" id="f-price" value="${p.price?.amount ?? ''}" min="0" placeholder="0"></div>
      <div class="fg"><label>Currency</label><input type="text" id="f-currency" value="${h(p.price?.currency || 'INR')}"></div>
    </div>
    <div class="fg"><label>Stock quantity</label><input type="number" id="f-stock" value="${p.stock?.total ?? ''}" min="0" placeholder="0"></div>
    <div class="toggle-row"><span>Featured in store</span><button type="button" class="toggle${p.stock?.is_featured ? ' on' : ''}" id="f-featured" aria-label="Featured"></button></div>
    ${hasAttrs ? section('attrs', 'Care details', `<div class="f2">
      <div class="fg"><label>Sunlight</label><input type="text" id="f-attr-sunlight" value="${h(attrs.sunlight || '')}" placeholder="e.g. Full sun"></div>
      <div class="fg"><label>Water</label><input type="text" id="f-attr-water" value="${h(attrs.water || '')}" placeholder="e.g. Weekly"></div>
      <div class="fg"><label>Height</label><input type="text" id="f-attr-height" value="${h(attrs.height || '')}" placeholder="e.g. 30–60 cm"></div>
      <div class="fg"><label>Difficulty</label><select id="f-attr-difficulty"><option value="">None</option>${['Easy', 'Moderate', 'Hard'].map(d => `<option ${attrs.difficulty === d ? 'selected' : ''}>${d}</option>`).join('')}</select></div></div>`, true) : ''}
    ${p.symbolism !== undefined ? section('sym', 'Symbolism', `
      <div class="fg"><label>Origin / story</label><textarea id="f-sym-origin" style="min-height:64px">${h(sym.origin || '')}</textarea></div>
      <div class="fg"><label>Meanings <span class="opt">(comma-separated)</span></label><input type="text" id="f-sym-meanings" value="${h((sym.meanings || []).join(', '))}"></div>`, false) : ''}
    ${section('grow', 'Season, growing and care guide', `<div class="f2">
      <div class="fg"><label>Planting season</label><input type="text" id="f-season-planting" value="${h(seasons.planting || '')}" placeholder="e.g. Feb–Apr and Jul–Aug"></div>
      <div class="fg"><label>Peak growth season</label><input type="text" id="f-season-growth" value="${h(seasons.peak_growth || '')}" placeholder="e.g. Mar–Sep"></div>
      <div class="fg"><label>Bloom / harvest season</label><input type="text" id="f-season-harvest" value="${h(seasons.harvest_or_bloom || '')}" placeholder="e.g. Jul–Oct"></div>
      <div class="fg"><label>Pruning / dormancy season</label><input type="text" id="f-season-rest" value="${h(seasons.pruning_or_dormancy || '')}" placeholder="e.g. Dec–Jan"></div>
    </div>
    <div class="fg"><label>Growing instructions <span class="opt">(one per line)</span></label>
      <textarea id="f-growing-instructions" style="min-height:90px">${h((guide.growing_instructions || []).join('\n'))}</textarea>
    </div>
    <div class="fg"><label>Care instructions <span class="opt">(one per line)</span></label>
      <textarea id="f-care-instructions" style="min-height:90px">${h((guide.care_instructions || []).join('\n'))}</textarea>
    </div>`, false)}
    ${p.composition !== undefined ? section('comp', 'Composition', `<textarea id="f-composition" data-mono>${h(JSON.stringify(p.composition, null, 2))}</textarea>`, false) : ''}
    ${Object.keys(extra).length ? extraSection(extra) : ''}`;
    }
    function medForm(p, extra) {
      const guide = p.growing_guide || {}, seasons = guide.seasons || {};
      const csv = (id, label, val, area) => `<div class="fg"><label>${label} <span class="opt">(comma-separated)</span></label>${area ? `<textarea id="${id}">${h((val || []).join(', '))}</textarea>` : `<input type="text" id="${id}" value="${h((val || []).join(', '))}">`}</div>`;
      return `
    <div class="f2">
      <div class="fg"><label>ID <span class="req">*</span></label><input type="text" id="f-id" value="${h(p.id || '')}" placeholder="unique-slug" ${S.isNew ? '' : 'readonly'}></div>
      <div class="fg"><label>Category</label><input type="text" id="f-category" value="${h(p.category || S.activeCat)}" readonly></div>
    </div>
    <div class="fg"><label>Display title <span class="req">*</span></label><input type="text" id="f-title" value="${h(p.title || '')}" placeholder="e.g. Abutilon"></div>
    <div class="fg"><label>Scientific name</label><input type="text" id="f-plant" value="${h(p.plant || '')}" placeholder="e.g. Abutilon theophrastii"></div>
    <div class="fg"><label>Family</label><input type="text" id="f-family" value="${h(p.family || '')}" placeholder="e.g. Malvaceae"></div>
    ${csv('f-common_name', 'Common names', p.common_name)}${csv('f-kashmiri_name', 'Kashmiri names', p.kashmiri_name)}
    ${csv('f-therapeutic_properties', 'Therapeutic properties', p.therapeutic_properties, true)}${csv('f-parts_used', 'Parts used', p.parts_used)}
    ${csv('f-health_benefits', 'Health benefits', p.health_benefits, true)}
    ${section('grow', 'Season, growing and care guide', `<div class="f2">
      <div class="fg"><label>Planting season</label><input type="text" id="f-season-planting" value="${h(seasons.planting || '')}" placeholder="e.g. Mar–Apr and Jul–Aug"></div>
      <div class="fg"><label>Peak growth season</label><input type="text" id="f-season-growth" value="${h(seasons.peak_growth || '')}" placeholder="e.g. Apr–Sep"></div>
      <div class="fg"><label>Bloom / harvest season</label><input type="text" id="f-season-harvest" value="${h(seasons.harvest_or_bloom || '')}" placeholder="e.g. May–Oct"></div>
      <div class="fg"><label>Pruning / dormancy season</label><input type="text" id="f-season-rest" value="${h(seasons.pruning_or_dormancy || '')}" placeholder="e.g. Nov–Feb"></div>
    </div>
    <div class="fg"><label>Growing instructions <span class="opt">(one per line)</span></label>
      <textarea id="f-growing-instructions" style="min-height:90px">${h((guide.growing_instructions || []).join('\n'))}</textarea>
    </div>
    <div class="fg"><label>Care instructions <span class="opt">(one per line)</span></label>
      <textarea id="f-care-instructions" style="min-height:90px">${h((guide.care_instructions || []).join('\n'))}</textarea>
    </div>`, false)}
    ${Object.keys(extra).length ? extraSection(extra) : ''}`;
    }
    function extraSection(obj) { return section('extra', 'Other fields (raw JSON)', `<textarea id="f-extra" data-mono>${h(JSON.stringify(obj, null, 2))}</textarea>`, false); }

    document.getElementById('drawer-body').addEventListener('click', e => {
      const btn = e.target.closest('[data-toggle]'); if (btn) {
        const t = document.getElementById(btn.dataset.toggle); if (!t) return;
        t.classList.toggle('hidden');
        const c = btn.querySelector('svg'); if (c) c.style.transform = t.classList.contains('hidden') ? '' : 'rotate(180deg)';
        return;
      }
      const tg = e.target.closest('#f-featured'); if (tg) tg.classList.toggle('on');
    });

    // ── Save ──
    function readLineList(id) {
      return (document.getElementById(id)?.value || '').split('\n').map(s => s.trim()).filter(Boolean);
    }
    function readGrowingGuide() {
      const v = id => (document.getElementById(id)?.value ?? '').trim();
      const seasons = {};
      [['planting', 'f-season-planting'], ['peak_growth', 'f-season-growth'], ['harvest_or_bloom', 'f-season-harvest'], ['pruning_or_dormancy', 'f-season-rest']]
        .forEach(([key, id]) => { const value = v(id); if (value) seasons[key] = value; });
      const growingInstructions = readLineList('f-growing-instructions');
      const careInstructions = readLineList('f-care-instructions');
      if (!Object.keys(seasons).length && !growingInstructions.length && !careInstructions.length) return null;
      const guide = {};
      if (Object.keys(seasons).length) guide.seasons = seasons;
      if (growingInstructions.length) guide.growing_instructions = growingInstructions;
      if (careInstructions.length) guide.care_instructions = careInstructions;
      return guide;
    }
    async function saveProduct() {
      const isMed = S.activeCat === 'medicinal-flora';
      const v = id => (document.getElementById(id)?.value ?? '').trim();
      const va = id => v(id).split(',').map(s => s.trim()).filter(Boolean);
      let product;
      if (isMed) {
        product = {
          id: v('f-id'), title: v('f-title'), category: v('f-category') || S.activeCat, plant: v('f-plant'), family: v('f-family'),
          common_name: va('f-common_name'), kashmiri_name: va('f-kashmiri_name'), therapeutic_properties: va('f-therapeutic_properties'),
          parts_used: va('f-parts_used'), health_benefits: va('f-health_benefits')
        };
      } else {
        product = {
          id: v('f-id'), title: v('f-title'), category: v('f-category') || S.activeCat, description: v('f-description'),
          price: { amount: parseFloat(v('f-price')) || 0, currency: v('f-currency') || 'INR' },
          stock: { total: parseInt(v('f-stock'), 10) || 0, is_featured: document.getElementById('f-featured')?.classList.contains('on') ?? false },
          media: { images: va('f-images') }
        };
        const subEl = document.getElementById('f-subtitle'); if (subEl) product.subtitle = subEl.value.trim();
        const attrs = {};
        [['sunlight', 'f-attr-sunlight'], ['water', 'f-attr-water'], ['height', 'f-attr-height'], ['difficulty', 'f-attr-difficulty']].forEach(([k, id]) => { if (v(id)) attrs[k] = v(id); });
        if (Object.keys(attrs).length) product.attributes = attrs;
        const symO = document.getElementById('f-sym-origin'), symM = document.getElementById('f-sym-meanings');
        if (symO || symM) { product.symbolism = {}; if (symO) product.symbolism.origin = symO.value.trim(); if (symM) product.symbolism.meanings = symM.value.split(',').map(s => s.trim()).filter(Boolean); }
        const compEl = document.getElementById('f-composition');
        if (compEl) { try { product.composition = JSON.parse(compEl.value); } catch { toast('Composition is not valid JSON', 'error'); return; } }
      }
      const growingGuide = readGrowingGuide();
      if (growingGuide) product.growing_guide = growingGuide;
      const extraEl = document.getElementById('f-extra');
      if (extraEl) { try { Object.assign(product, JSON.parse(extraEl.value || '{}')); } catch { toast('Other fields are not valid JSON', 'error'); return; } }
      if (!product.id) { toast('Add an ID before saving', 'error'); return; }
      if (!product.title) { toast('Add a title before saving', 'error'); return; }

      const btn = document.getElementById('save-btn');
      btn.disabled = true; btn.textContent = 'Saving…';
      const r = S.isNew ? await api('POST', `products/${S.activeCat}`, product)
        : await api('PUT', `products/${S.activeCat}/${encodeURIComponent(product.id)}`, product);
      btn.disabled = false; btn.textContent = 'Save changes';
      if (r.ok) {
        toast(S.isNew ? 'Product added' : 'Changes saved', 'ok');
        const wasNew = S.isNew; closeDrawer();
        if (wasNew) { S.products.push(product); const c = S.cats.find(c => c.id === S.activeCat); if (c) c.count++; renderSidebar(); }
        else { const i = S.products.findIndex(x => x.id === product.id); if (i >= 0) S.products[i] = product; }
        applyFilter(); renderProducts();
      } else toast(r.data?.error || 'Could not save. Please try again.', 'error');
    }

    // ── Delete ──
    function confirmDelete() {
      if (!S.editing) return;
      const p = S.editing, bg = document.createElement('div');
      bg.className = 'dialog-bg';
      bg.innerHTML = `<div class="dialog" role="alertdialog"><h3>Delete this product?</h3>
    <p><strong>${h(p.title || p.id)}</strong> will be permanently removed. This can't be undone.</p>
    <div class="dialog-actions"><button class="btn btn-secondary" id="dlg-cancel">Keep product</button><button class="btn btn-danger" id="dlg-confirm">Delete product</button></div></div>`;
      document.body.appendChild(bg);
      bg.querySelector('#dlg-cancel').addEventListener('click', () => bg.remove());
      bg.querySelector('#dlg-confirm').addEventListener('click', async () => {
        bg.remove();
        const id = p.id, r = await api('DELETE', `products/${S.activeCat}/${encodeURIComponent(id)}`);
        if (r.ok) {
          toast('Product deleted', 'ok'); closeDrawer();
          S.products = S.products.filter(x => x.id !== id);
          const c = S.cats.find(c => c.id === S.activeCat); if (c) c.count--;
          renderSidebar(); applyFilter(); renderProducts();
        } else toast(r.data?.error || 'Could not delete product', 'error');
      });
    }

    // ── Events ──
    document.getElementById('overlay').addEventListener('click', closeDrawer);
    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    document.getElementById('cancel-btn').addEventListener('click', closeDrawer);
    document.getElementById('save-btn').addEventListener('click', saveProduct);
    document.getElementById('delete-btn').addEventListener('click', confirmDelete);
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });

    const main = document.getElementById('main');
    main.addEventListener('input', e => { if (e.target.id === 'search-input') { S.searchQ = e.target.value; applyFilter(); refreshTableZone(); } });
    main.addEventListener('click', e => {
      const tile = e.target.closest('.tile'); if (tile) { loadProducts(tile.dataset.cat); return; }
      const chip = e.target.closest('[data-filter]');
      if (chip) {
        const k = { featured: 'filterFeatured', low: 'filterLow', out: 'filterOut' }[chip.dataset.filter];
        S[k] = !S[k];
        if (k === 'filterLow' && S[k]) { S.filterOut = false; } if (k === 'filterOut' && S[k]) { S.filterLow = false; }
        document.querySelectorAll('.chip').forEach(c => c.classList.toggle('on', S[{ featured: 'filterFeatured', low: 'filterLow', out: 'filterOut' }[c.dataset.filter]]));
        applyFilter(); refreshTableZone(); return;
      }
      if (e.target.closest('#add-btn')) { openNew(); return; }
      const row = e.target.closest('tr[data-id]');
      if (row) {
        if (e.target.closest('.star')) quickToggleFeatured(row.dataset.id, row);
        else if (e.target.closest('.edit-btn')) openEdit(row.dataset.id);
      }
    });
    main.addEventListener('change', e => {
      if (e.target.id === 'sort-select') { S.sort = e.target.value; applyFilter(); refreshTableZone(); return; }
      if (e.target.classList.contains('stock-input')) {
        const row = e.target.closest('tr[data-id]'); if (row) quickUpdateStock(row.dataset.id, e.target.value, row);
      }
    });
    main.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.classList.contains('stock-input')) e.target.blur(); });

    // ── Helpers ──
    function toast(msg, type = 'info') {
      const el = Object.assign(document.createElement('div'), { className: `toast ${type}`, textContent: msg });
      document.getElementById('toasts').appendChild(el);
      setTimeout(() => el.remove(), 3200);
    }
    function h(s) { return String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;'); }
    function fmtCat(id) { return id.replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); }
    function fmtPrice(price) { if (!price) return '–'; return `${price.currency === 'INR' ? '₹' : (price.currency || '')}${(price.amount ?? 0).toLocaleString('en-IN')}`; }
    function deepClone(o) { return JSON.parse(JSON.stringify(o)); }
    function setMain(html) { main.innerHTML = html; }
    function spinner() { return '<div class="loading"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" stroke-opacity=".2"/><path d="M12 3a9 9 0 019 9"/></svg>Loading…</div>'; }
    function icon(n) { return n === 'warn' ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>' : ''; }
  </script>
</body>

</html>
